name: CI & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Get version from pyproject.toml
        id: get_version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify Tag Matches Project Version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PUBSPEC_VERSION=${{ steps.get_version.outputs.version }}
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Error: Tag version (v$TAG_VERSION) does not match pyproject.toml version ($PUBSPEC_VERSION)"
            exit 1
          fi
          echo "Success: Tag v$TAG_VERSION matches project version!"

      - name: Build Windows Executable
        if: steps.get_version.outputs.version != '0.0.0'
        run: |
          pyinstaller --name "File Alchemy" --icon=assets/logo.ico --windowed src/file_alchemy/app.py

      - name: Rename executable for release
        if: steps.get_version.outputs.version != '0.0.0'
        shell: bash
        run: |
          mv "dist/File Alchemy.exe" "dist/File-Alchemy-v${{ steps.get_version.outputs.version }}-Windows.exe"

      - name: Ensure CHANGELOG entry exists & extract notes
        id: changelog
        if: steps.get_version.outputs.version != '0.0.0'
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.get_version.outputs.version }}
          path: ./CHANGELOG.md

      - name: Create GitHub Release
        if: steps.get_version.outputs.version != '0.0.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.changes }}
          files: |
            dist/File-Alchemy-*-Windows.exe
