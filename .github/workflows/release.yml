name: CI & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  update-badge:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data

      - name: Update Coverage Badge in README
        run: |
          if [ -f coverage.json ]; then
            # Extract coverage percentage from coverage.json
            COV=$(python3 -c "import json; print(int(float(json.load(open('coverage.json'))['totals']['percent_covered_display'])))")
            
            # Determine color
            COLOR="green"
            if [ "$COV" -lt 80 ]; then COLOR="red"; fi
            if [ "$COV" -ge 80 ] && [ "$COV" -lt 90 ]; then COLOR="yellow"; fi
            
            # Replace badge in README.md
            sed -i -E "s/coverage-[a-zA-Z0-9%]+-[a-zA-Z]+/coverage-${COV}%25-${COLOR}/g" README.md
            
            # Commit changes on a dedicated branch and open a PR
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add README.md
            
            # If there are no changes staged, exit without creating a branch/PR
            if git diff --cached --quiet; then
              echo "No coverage changes to commit"
              exit 0
            fi
            
            BRANCH_NAME="coverage-badge-update-${GITHUB_RUN_ID}"
            git checkout -b "$BRANCH_NAME"
            git commit -m "docs: update coverage badge to ${COV}% [skip ci]"
            git push origin "$BRANCH_NAME"
            
            # Create a pull request targeting main (if possible)
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "docs: update coverage badge to ${COV}%" \
              --body "Automated update of coverage badge to ${COV}%." || echo "Pull request creation skipped or failed"
          fi

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Get version from pyproject.toml
        id: get_version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify Tag Matches Project Version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PROJECT_VERSION=${{ steps.get_version.outputs.version }}
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Error: Tag version (v$TAG_VERSION) does not match pyproject.toml version ($PROJECT_VERSION)"
            exit 1
          fi
          echo "Success: Tag v$TAG_VERSION matches project version!"

      - name: Build Windows Executable
        if: steps.get_version.outputs.version != '0.0.0'
        run: |
          pyinstaller --name "File Alchemy" --onefile --icon=assets/logo.ico --windowed src/file_alchemy/app.py

      - name: Rename executable for release
        if: steps.get_version.outputs.version != '0.0.0'
        shell: bash
        run: |
          mv "dist/File Alchemy.exe" "dist/File-Alchemy-v${{ steps.get_version.outputs.version }}-Windows.exe"

      - name: Ensure CHANGELOG entry exists & extract notes
        id: changelog
        if: steps.get_version.outputs.version != '0.0.0'
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.get_version.outputs.version }}
          path: ./CHANGELOG.md

      - name: Create GitHub Release
        if: steps.get_version.outputs.version != '0.0.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.changes }}
          files: |
            dist/File-Alchemy-*-Windows.exe
