name: CI & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up dev environment
        uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.11"

      - name: Get version from pyproject.toml
        id: get_version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify Tag Matches Project Version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PROJECT_VERSION=${{ steps.get_version.outputs.version }}
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Error: Tag version (v$TAG_VERSION) does not match pyproject.toml version ($PROJECT_VERSION)"
            exit 1
          fi
          echo "Success: Tag v$TAG_VERSION matches project version!"

  lint:
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up dev environment
        uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.11"

      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-system-deps

      - name: Format project source
        run: ruff format --check .

      - name: Analyze project source
        run: ruff check .

  test:
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up dev environment
        uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.11"

      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-system-deps

      - name: Run tests and collect coverage
        run: |
          if [ -d tests ]; then
            pytest --cov-report=json
          else
            echo "No tests directory found, skipping pytest."
          fi

      - name: Upload coverage data
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: coverage.json
          retention-days: 1
          if-no-files-found: ignore

  update-badge:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download coverage data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-data

      - name: Update coverage badge
        uses: ./.github/actions/update-coverage-badge
        with:
          source-sha: ${{ github.sha }}

  release:
    needs:
      - validate-release
      - lint
      - test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up dev environment
        uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.11"

      - name: Build Windows Executable
        if: needs.validate-release.outputs.version != '0.0.0'
        run: |
          pyinstaller file_alchemy.spec

      - name: Zip distribution folder
        if: needs.validate-release.outputs.version != '0.0.0'
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/File Alchemy/*' -DestinationPath "dist/File-Alchemy-v${{ needs.validate-release.outputs.version }}-Windows.zip"

      - name: Ensure CHANGELOG entry exists & extract notes
        id: changelog
        if: needs.validate-release.outputs.version != '0.0.0'
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ needs.validate-release.outputs.version }}
          path: ./CHANGELOG.md

      - name: Create GitHub Release
        if: needs.validate-release.outputs.version != '0.0.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate-release.outputs.version }}
          name: Release v${{ needs.validate-release.outputs.version }}
          body: ${{ steps.changelog.outputs.changes }}
          files: |
            dist/File-Alchemy-*-Windows.zip
