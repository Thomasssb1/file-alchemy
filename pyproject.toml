[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-alchemy"
version = "0.1.0"
description = "Universal file converter with FFmpeg integration and a modern Fluent UI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PyQt6>=6.6",
    "pyqt6-fluent-widgets>=1.7",
    "ffmpeg-python>=0.2.0",
    "pygltflib>=1.16",
    "trimesh>=4.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
file-alchemy = "file_alchemy.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/file_alchemy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
